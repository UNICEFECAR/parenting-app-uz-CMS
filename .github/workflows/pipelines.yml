name: CI Checks

on:
  push:
    branches:
      - 'develop'
      - 'stage'
  pull_request:
    branches:
      - 'feature/**'
      - 'bug/**'
      - 'hotfix/**'
      - 'develop'
      - 'stage'
  workflow_dispatch:

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer
          extensions: mbstring, pdo, xml, gd, curl, zip, bcmath, intl

      - name: Composer install
        run: |
          composer validate --no-check-all --ansi
          composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS
        run: ./vendor/bin/phpcs

      - name: Run Drupal Check
        run: ./vendor/bin/drupal-check -d docroot/modules/custom

      - name: Run PHPlint
        run: ./vendor/bin/phplint
